html/head_include="<script>(function(){window.__webxr_ffr_level=1.0;if(typeof XRWebGLBinding!=='undefined'&&XRWebGLBinding.prototype){var origCreate=XRWebGLBinding.prototype.createProjectionLayer;if(origCreate){XRWebGLBinding.prototype.createProjectionLayer=function(){var layer=origCreate.apply(this,arguments);window.__webxr_projection_layer=layer;if('fixedFoveation' in layer&&window.__webxr_ffr_level!==null){layer.fixedFoveation=window.__webxr_ffr_level;console.log('[WebXR FFR] Initialized projection layer fixedFoveation to',window.__webxr_ffr_level);}return layer;};}}if(navigator.xr&&navigator.xr.requestSession){var origReq=navigator.xr.requestSession.bind(navigator.xr);navigator.xr.requestSession=async function(){var session=await origReq.apply(navigator.xr,arguments);window.__webxr_session=session;var origUpdate=session.updateRenderState.bind(session);session.updateRenderState=function(state){if(state&&state.layers){window.__webxr_layers=state.layers;for(var i=0;i<state.layers.length;i++){var l=state.layers[i];if('fixedFoveation' in l&&window.__webxr_ffr_level!==null){l.fixedFoveation=window.__webxr_ffr_level;}}}if(state&&state.baseLayer){window.__webxr_base_layer=state.baseLayer;if('fixedFoveation' in state.baseLayer&&window.__webxr_ffr_level!==null){state.baseLayer.fixedFoveation=window.__webxr_ffr_level;}}return origUpdate(state);};return session;};}window.__webxr_set_ffr=function(lvl){window.__webxr_ffr_level=lvl;var applied=false;if(window.__webxr_projection_layer&&'fixedFoveation' in window.__webxr_projection_layer){window.__webxr_projection_layer.fixedFoveation=lvl;applied=true;}if(window.__webxr_layers){for(var i=0;i<window.__webxr_layers.length;i++){var l=window.__webxr_layers[i];if('fixedFoveation' in l){l.fixedFoveation=lvl;applied=true;}}}if(window.__webxr_session&&window.__webxr_session.renderState){var rs=window.__webxr_session.renderState;if(rs.baseLayer&&'fixedFoveation' in rs.baseLayer){rs.baseLayer.fixedFoveation=lvl;applied=true;}if(rs.layers){for(var j=0;j<rs.layers.length;j++){if('fixedFoveation' in rs.layers[j]){rs.layers[j].fixedFoveation=lvl;applied=true;}}}}console.log('[WebXR FFR] Set fixedFoveation to '+lvl+' (applied: '+applied+')');return applied;};})();</script>"
